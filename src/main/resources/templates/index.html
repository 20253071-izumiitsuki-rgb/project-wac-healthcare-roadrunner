<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HealthCare.com</title>
    <link rel="icon" th:href="@{/img/common/favicon.ico}" href="../static/img/common/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css" />
  </head>
  <body>
    <header>
      <!-- 左側のグループ：ロゴとタイトル -->
      <a href="#" th:href="@{/}">
        <img
          class="header-logo"
          th:src="@{/img/common/healthcare.png}"
          src="../static/img/common/healthcare.png"
        />
        <strong>HealthCare.com</strong>
      </a>

      <!-- 右側のグループ：切り替えボタンとログアウト -->
      <div style="display: flex; align-items: center; gap: 15px">
        <button
          id="theme-toggle"
          style="
            padding: 5px 10px;
            font-size: 14px;
            background-color: var(--white-color);
            color: var(--dark-gray-color);
            border: 1px solid var(--light-gray-color);
          "
        >
          🌙 ダークモード
        </button>

        <a href="#" th:href="@{/logout}">
          <img th:src="@{/img/common/exit.svg}" src="../static/img/common/exit.svg" />ログアウト
        </a>
      </div>
    </header>

    <main>
      <h1 class="page-title">
        <span th:text="${session.userData.userName}">XXXX</span>さんのダッシュボード
      </h1>
      <div class="card">
        <div class="card-content">
          <h3>一般機能</h3>
          <ul>
            <li><a href="#" th:href="@{/task}">タスク管理 </a></li>
            <li><a href="#" th:href="@{/bmi}">BMI計算</a></li>
            <li><a href="#" th:href="@{/weather}">お天気情報</a></li>
            <li><a href="#" th:href="@{/time}">運動時間管理</a></li>
            <li><a href="#" th:href="@{/routine}">シフト連動ルーティン生成</a></li>
          </ul>
        </div>
        <div th:if="${session.userData.role} == 'ROLE_ADMIN'">
          <h3>管理者機能</h3>
          <ul>
            <li>
              <a href="#" th:href="@{/user/list}"> [DB]ユーザ管理機能 </a>
            </li>
          </ul>
        </div>
      </div>
      <!-- .card -->
    </main>
    <footer>&copy; 2026 HealthCare.com</footer>

    <script>
      const themeToggleBtn = document.getElementById("theme-toggle");
      const body = document.body;

      // ページを開いた時：ブラウザに保存された設定を復元
      const currentTheme = localStorage.getItem("theme");
      if (currentTheme === "dark") {
        body.classList.add("dark-mode");
        themeToggleBtn.textContent = "☀️ ライトモード";
      }

      // ボタンがクリックされた時の処理
      themeToggleBtn.addEventListener("click", () => {
        body.classList.toggle("dark-mode");

        if (body.classList.contains("dark-mode")) {
          localStorage.setItem("theme", "dark");
          themeToggleBtn.textContent = "☀️ ライトモード";
        } else {
          localStorage.setItem("theme", "light");
          themeToggleBtn.textContent = "🌙 ダークモード";
        }
      });
    </script>
  </body>
</html>
