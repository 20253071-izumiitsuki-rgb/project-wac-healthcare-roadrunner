<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebPortal.com</title>
    <link
      rel="icon"
      th:href="@{/img/common/favicon.ico}"
      href="../../static/img/common/favicon.ico"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css" />
  </head>

  <body>
    <header>
      <a href="#" th:href="@{/}">
        <img
          class="header-logo"
          th:src="@{/img/common/izuniituki.png}"
          src="../static/img/common/izuniituki.png"
        />
        <strong>嚙もうとすんな俺の肩、腕.com</strong>
      </a>
      <div style="display: flex; align-items: center; gap: 15px">
        <button
          id="theme-toggle"
          style="
            padding: 5px 10px;
            font-size: 14px;
            background-color: var(--white-color);
            color: var(--dark-gray-color);
            border: 1px solid var(--light-gray-color);
          "
        >
          ダークモード
        </button>

        <a href="#" th:href="@{/logout}">
          <img th:src="@{/img/common/exit.svg}" src="../static/img/common/exit.svg" />ログアウト
        </a>
      </div>
    </header>
    <main>
      <h1 class="page-title">天気予報 入力</h1>
      <p class="error-message" th:if="${errorMessage}" th:text="${errorMessage}">
        エラーメッセージ
      </p>
      <div class="card">
        <div class="card-content">
          <form method="post" th:action="@{/weather}">
            <span id="addon-wrapping">地域</span>
            <select id="citycode" name="citycode">
              <option value="011000">稚内</option>
              <option value="012010">旭川</option>
              <option value="012020">留萌</option>
              <option value="013010">網走</option>
              <option value="013020">北見</option>
              <option value="013030">紋別</option>
              <option value="014010">根室</option>
              <option value="014020">釧路</option>
              <option value="014030">帯広</option>
              <option value="015010">室蘭</option>
              <option value="015020">浦河</option>
              <option value="016010">札幌</option>
              <option value="016020">岩見沢</option>
              <option value="016030">倶知安</option>
              <option value="017010">函館</option>
              <option value="017020">江差</option>
            </select>
            <button type="submit">送信</button>
          </form>
        </div>
      </div>
      <!-- .card -->
    </main>
    <footer>&copy; 2024 WebPortal.com</footer>
    <script>
      const themeToggleBtn = document.getElementById("theme-toggle");
      const body = document.body;

      const currentTheme = localStorage.getItem("theme");
      if (currentTheme === "dark") {
        body.classList.add("dark-mode");
        themeToggleBtn.textContent = " ライトモード";
      }

      themeToggleBtn.addEventListener("click", () => {
        body.classList.toggle("dark-mode");

        if (body.classList.contains("dark-mode")) {
          localStorage.setItem("theme", "dark");
          themeToggleBtn.textContent = " ライトモード";
        } else {
          localStorage.setItem("theme", "light");
          themeToggleBtn.textContent = " ダークモード";
        }
      });
    </script>
  </body>
</html>
