<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebPortal.com</title>
    <link
      rel="icon"
      th:href="@{/img/common/favicon.ico}"
      href="../../static/img/common/favicon.ico"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css" />
  </head>

  <body>
    <header>
      <!-- 左側のグループ：ロゴとタイトル -->
      <a href="#" th:href="@{/}">
        <img
          class="header-logo"
          th:src="@{/img/common/healthcare.png}"
          src="../static/img/common/healthcare.png"
        />
        <strong>HealthCare.com</strong>
      </a>

      <!-- 右側のグループ：切り替えボタンとログアウト -->
      <div style="display: flex; align-items: center; gap: 15px">
        <button
          id="theme-toggle"
          style="
            padding: 5px 10px;
            font-size: 14px;
            background-color: var(--white-color);
            color: var(--dark-gray-color);
            border: 1px solid var(--light-gray-color);
          "
        >
          ダークモード
        </button>

        <a href="#" th:href="@{/logout}">
          <img th:src="@{/img/common/exit.svg}" src="../static/img/common/exit.svg" />ログアウト
        </a>
      </div>
    </header>

    <main>
      <h1 class="page-title">BMI 入力</h1>
      <div class="card">
        <div class="card-content">
          <form method="post" th:action="@{/bmi}">
            <label for="height">身長(cm)</label>
            <input id="height" type="text" name="cm" />
            <label for="weight">体重(kg)</label>
            <input id="weight" type="text" name="kg" />
            <button type="submit">計算</button>
          </form>
        </div>
      </div>
      <!-- .card -->
    </main>
    <footer>&copy; 2024 WebPortal.com</footer>
    <script>
      const themeToggleBtn = document.getElementById("theme-toggle");
      const body = document.body;

      const currentTheme = localStorage.getItem("theme");
      if (currentTheme === "dark") {
        body.classList.add("dark-mode");
        themeToggleBtn.textContent = " ライトモード";
      }

      themeToggleBtn.addEventListener("click", () => {
        body.classList.toggle("dark-mode");

        if (body.classList.contains("dark-mode")) {
          localStorage.setItem("theme", "dark");
          themeToggleBtn.textContent = " ライトモード";
        } else {
          localStorage.setItem("theme", "light");
          themeToggleBtn.textContent = " ダークモード";
        }
      });
    </script>
  </body>
</html>
